[package]
name = "wage3-backend"
version = "0.1.0"
edition = "2024"

[dependencies]
alloy = "2.5.0"
axum = { version = "0.8.9", features = ["macros"] }
chrono = { version = "0.4.45", features = ["serde"] }
dotenvy = "0.15.7"
hex = "0.4.3"
hmac = "0.13.0"
jsonwebtoken = { version = "11.1.0", features = ["rust_crypto"] }
openidconnect = "4.0.1"
rand = "0.10.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.1"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "postgres", "macros", "uuid", "chrono"] }
tokio = { version = "1.53.2", features = ["full"] }
tower = { version = "0.5.3", features = ["full", "tracing"] }
tower-http = { version = "0.7.1", features = ["full"] }
tower_governor = { version = "=0.6.0", features = ["tracing"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.28.0", features = ["v4", "serde"] }
validator = { version = "0.21.0", features = ["derive"] }
